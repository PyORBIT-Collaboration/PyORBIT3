name: build-pyorbit

on:
  pull_request:
    branches:
      - main
  push:
    tags:
      - '*'
    branches:
      - '*'

jobs:


  apple-silicon:
    runs-on: macos-14
    steps:
      - name: Install packages
        run: |
          brew reinstall pkg-config fftw

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build
        run: |
          .github/workflows/pip-build.sh

      - name: Test
        run: |
          .github/workflows/pip-tests.sh

      - name: Print Versions
        run: |
          .github/workflows/pip-versions.sh


  centos-stream:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    steps:
         - name: Install packages
           run: |
             dnf group install -y "Development Tools"
             dnf install -y python3-devel fftw3-devel

         - uses: actions/checkout@v4
           with:
            fetch-depth: 0
         - name: Build
           run: |
             .github/workflows/pip-build.sh

         - name: Test
           run: |
             .github/workflows/pip-tests.sh

         - name: Print Versions
           run: |
             .github/workflows/pip-versions.sh



  ubuntu:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
         - name: Install packages
           run: |
             apt-get update -y
             apt-get install -y  build-essential python3 libfftw3-dev python3-venv libpython3-dev pkg-config git

         - uses: actions/checkout@v4
           with:
            fetch-depth: 0

         - name: Build
           run: |
             .github/workflows/pip-build.sh

         - name: Test
           run: |
             .github/workflows/pip-tests.sh

         - name: Print Versions
           run: |
             .github/workflows/pip-versions.sh


  conda:
    runs-on: ubuntu-latest
    container:
      image: ubuntu:latest
    steps:
         - name: Install Conda
           run: |
             apt update -y
             apt install -y curl gpg git build-essential
             curl https://repo.anaconda.com/pkgs/misc/gpgkeys/anaconda.asc | gpg --dearmor > conda.gpg
             install -o root -g root -m 644 conda.gpg /usr/share/keyrings/conda-archive-keyring.gpg
             echo "deb [arch=amd64 signed-by=/usr/share/keyrings/conda-archive-keyring.gpg] https://repo.anaconda.com/pkgs/misc/debrepo/conda stable main" > /etc/apt/sources.list.d/conda.list
             apt update -y
             apt install -y conda

         - uses: actions/checkout@v4
           with:
            fetch-depth: 0

         - name: Build
           run: |
             .github/workflows/conda-build.sh

         - name: Test
           run: |
             .github/workflows/conda-tests.sh

         - name: Print Versions
           run: |
             .github/workflows/conda-versions.sh

  mpich:
    runs-on: ubuntu-latest
    container:
      image: quay.io/centos/centos:stream9
    steps:
         - name: Install packages
           run: |
             dnf group install -y "Development Tools"
             dnf install -y python3-devel fftw3-devel mpich-devel hwloc-devel

         - uses: actions/checkout@v4
           with:
            fetch-depth: 0
         - name: Build
           run: |
             .github/workflows/pip-build-mpich.sh

         - name: Test
           run: |
             .github/workflows/pip-tests-mpi.sh

         - name: Print Versions
           run: |
             .github/workflows/pip-versions.sh

  python-tests:
    name: Python tests (${{ matrix.mpi }})
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        include:
          - mpi: none
            mpi_packages: ""
            mpiexec_preflags: ""
          - mpi: mpich
            mpi_packages: >-
              mpich
              libfabric-devel
            mpiexec_preflags: ""
          - mpi: ompi
            mpi_packages: openmpi
            mpiexec_preflags: --oversubscribe

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: mamba-org/setup-micromamba@v3
        with:
          environment-name: pyorbit-test
          create-args: >-
            python=3.13
            numpy
            pytest
            fftw
            meson
            ninja
            pkg-config
            setuptools
            setuptools-scm
            ${{ matrix.mpi_packages }}
          cache-downloads: true

      - name: Configure
        shell: bash -el {0}
        run: |
          meson setup build-${{ matrix.mpi }} \
            --prefix="$CONDA_PREFIX" \
            --libdir=lib \
            --buildtype=release \
            -DUSE_MPI=${{ matrix.mpi }} \
            -DPyORBIT_EXPERIMENTAL_WITH_NUMPY=true

      - name: Compile
        shell: bash -el {0}
        run: |
          meson compile -C build-${{ matrix.mpi }}

      - name: Install
        shell: bash -el {0}
        run: |
          meson install --no-rebuild -C build-${{ matrix.mpi }}

      - name: Show MPI configuration
        if: matrix.mpi != 'none'
        shell: bash -el {0}
        run: |
          mpirun --version

      - name: Run Python tests
        shell: bash -el {0}
        env:
          PYORBIT_MPIEXEC_PREFLAGS: ${{ matrix.mpiexec_preflags }}
        run: |
          export LD_LIBRARY_PATH="$CONDA_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          python -m pytest tests/py/ -v

  build-docs:
    uses: ./.github/workflows/docs-build.yml
