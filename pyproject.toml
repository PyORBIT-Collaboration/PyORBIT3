[build-system]
build-backend = "mesonpy"
requires = ["meson-python", "setuptools_scm"]

[project]
name = "PyORBIT"
dynamic = ["version"]
description = "Particle accelerator beam dynamics simulation." 
requires-python = '>=3.10'
authors = [
  {name = "Alexander Zhukov", email = "zhukovap@ornl.gov"},
]

[project.optional-dependencies]
numpy = [ "numpy" ]
examples = [ "numpy", "scipy", "matplotlib", "pandas" ]
tests = [ "pytest" ]

[tool.setuptools_scm]

